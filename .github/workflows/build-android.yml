name: Build Tired-Off Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Extract Tired-Off source
        run: unzip -o tired-off-source.zip -d .

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Sync Android project
        run: pnpm exec cap sync android

      - name: Set fresh test version
        run: sed -i 's/versionCode 1/versionCode 3/' android/app/build.gradle

      - name: Build release APK
        working-directory: android
        run: ./gradlew clean assembleRelease

      - name: Sign installation APK
        run: |
          keytool -genkeypair -v -keystore tiredoff-test.keystore -alias tiredoff -keyalg RSA -keysize 2048 -validity 10000 -storepass tiredofftest -keypass tiredofftest -dname "CN=Tired-Off Test, O=Tired-Off, C=GB"
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$ZIPALIGN" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk Tired-Off-Android-Test-aligned.apk
          "$APKSIGNER" sign --ks tiredoff-test.keystore --ks-pass pass:tiredofftest --key-pass pass:tiredofftest --out Tired-Off-Android-Test.apk Tired-Off-Android-Test-aligned.apk
          "$APKSIGNER" verify --verbose Tired-Off-Android-Test.apk

      - name: Upload Android test app
        uses: actions/upload-artifact@v4
        with:
          name: Tired-Off-Android-16KB-Test
          path: Tired-Off-Android-Test.apk
          if-no-files-found: error
